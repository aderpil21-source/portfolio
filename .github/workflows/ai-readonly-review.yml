name: AI read-only review (routed)
on:
  pull_request:
    paths:
      - '.github/workflows/ai-readonly-review.yml'
  workflow_dispatch:
    inputs:
      task:
        description: 'Read-only review request'
        required: true
        default: 'Review portfolio accessibility and mobile layout'
        type: string
      complexity:
        description: 'Route to a model'
        required: true
        default: 'simple'
        type: choice
        options:
          - simple
          - coding
          - architecture
permissions:
  contents: read
  copilot-requests: write
concurrency:
  group: ai-readonly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ai-review:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'automation/copilot-readonly-ai')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official Copilot CLI
        run: npm install -g @github/copilot
      - name: Select actual model and run one AI review
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_TASK: ${{ inputs.task || 'Review portfolio accessibility and mobile layout' }}
          COMPLEXITY: ${{ inputs.complexity || 'simple' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$COMPLEXITY" in
            simple) MODEL="gpt-6-luna"; FALLBACK="claude-haiku-4.5" ;;
            coding) MODEL="gpt-6.1-sol"; FALLBACK="gpt-5.3-codex" ;;
            architecture) MODEL="gpt-6-astra"; FALLBACK="gpt-5.4" ;;
            *) echo "Invalid complexity"; exit 2 ;;
          esac
          echo "Selected model: $MODEL (alternative if manually reconfigured: $FALLBACK)"
          python3 - <<'PY'
          import os
          task = os.environ['REVIEW_TASK'][:300]
          with open('/tmp/ai-prompt.txt','w') as f:
              f.write("Provide a concise READ-ONLY review. Do not edit files, execute commands, access secrets or external URLs. Identify up to 3 actionable issues with file paths. If you cannot inspect files safely, say so. Request: "+task)
          PY
          copilot -p "$(cat /tmp/ai-prompt.txt)" --model "$MODEL" --max-ai-credits 30 --no-ask-user > /tmp/ai-review.txt
          test -s /tmp/ai-review.txt
          {
            echo "## Routed AI review"
            echo "Selected model: \`$MODEL\`"
            echo "Fallback candidate (not automatically invoked): \`$FALLBACK\`"
            echo "Session soft limit: 30 AI Credits (minimum allowed by Copilot CLI)"
            echo '~~~'
            head -c 12000 /tmp/ai-review.txt
            echo
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
