name: Portfolio chat keepalive
on:
  schedule:
    # GitHub scheduled workflows are best-effort; 5 min is the minimum interval.
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Telegram chat service health
        env:
          HEALTH_URL: https://denis-kats-portfolio-chat.onrender.com/health
        run: |
          curl --silent --show-error --fail --location \
            --connect-timeout 15 --max-time 75 \
            --retry 2 --retry-delay 4 \
            "${HEALTH_URL}" > /dev/null
# Render Free can still sleep if GitHub cron is delayed; pinging is not an uptime SLA.
