name: Portfolio chat API security checks
on:
  push:
    branches: [portfolio-chat-service]
  pull_request:
    branches: [portfolio-chat-service]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Node.js API syntax
        run: node --check lead-api/server.js
      - name: Check for embedded Telegram bot secret
        run: |
          node -e "const fs=require('fs'); const t=fs.readFileSync('lead-api/server.js','utf8'); if(!t.includes('process.env.TELEGRAM_BOT_TOKEN') || !t.includes('process.env.PORTFOLIO_STORE_KEY'))process.exit(1); console.log('Secrets are referenced as environment variables');"
