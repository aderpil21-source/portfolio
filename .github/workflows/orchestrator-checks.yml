name: Orchestrator deterministic checks
on:
  pull_request:
    paths:
      - '.github/scripts/ai_router.py'
      - '.github/scripts/test_ai_router.py'
      - '.github/workflows/orchestrator-checks.yml'
      - '.github/scripts/agent_checks.py'
      - '.github/scripts/test_agent_checks.py'
      - '.github/scripts/decision_adapter.py'
      - '.github/scripts/test_decision_adapter.py'
      - '.github/scripts/agent_cycle.py'
      - '.github/scripts/test_agent_cycle.py'
      - '.github/ai-task.json'
      - '.github/workflows/ai-implement-scoped.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Router unit tests (no AI credits)
        run: python -m unittest discover -s .github/scripts -p 'test_ai_router.py' -v
      - name: Validate allowed AI task
        run: |
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'.github/scripts')
          from agent_checks import validate_task
          with open('.github/ai-task.json') as f: validate_task(json.load(f))
          PY
      - name: Syntax and diff checks
        run: |
          python -m py_compile .github/scripts/ai_router.py .github/scripts/test_ai_router.py .github/scripts/agent_checks.py .github/scripts/test_agent_checks.py .github/scripts/decision_adapter.py .github/scripts/test_decision_adapter.py .github/scripts/agent_cycle.py .github/scripts/test_agent_cycle.py
          git diff --check "$(git merge-base HEAD origin/main)" HEAD
      - name: Demonstrate routing without AI
        run: |
          python .github/scripts/ai_router.py --task "Change title text"
          python .github/scripts/ai_router.py --task "Fix mobile layout"
          python .github/scripts/ai_router.py --task "Review authentication security"
